# Granola-to-Obsidian Sync Configuration
# Copy this file to config.yaml and fill in your values.

# Obsidian vault root - files go directly here, no subfolders
# macOS example: "~/Obsidian/SebasVault"
# Windows example: "C:\\Users\\YourName\\Documents\\ObsidianVault"
vault_path: "~/path/to/your/ObsidianVault"

# Your own email addresses. Used to tell a one-to-one apart from a group call:
# in a one-to-one the other speaker can be named without guessing, in a group
# every remote voice collapses into a single "Speaker".
owner_emails: []

# Granola credentials (auto-detected if not specified)
# Windows: %APPDATA%\Granola\supabase.json
# macOS: ~/Library/Application Support/Granola/supabase.json
# credentials_path: ""

# WorkOS client ID (auto-detected, override only if needed)
# workos_client_id: "client_01JZJ0XBDAT8PHJWQY09Y0VD61"

# Sync settings
sync:
  include_transcripts: true
  fuzzy_threshold: 85        # 0-100 for duplicate title matching
  notes_folder: "Reuniones"  # Obsidian subfolder for synced meeting notes
  transcripts_folder: "Transcripciones"  # where the literal transcripts go
  # separate: the transcript gets its own note and the meeting note keeps a
  #   folded callout linking to it (keeps the vault light for AI queries)
  # inline: legacy behaviour, transcript embedded in the meeting note
  # none: no transcript at all
  transcript_mode: separate

# Claude AI enrichment
enrichment:
  enabled: true
  api_key: "sk-ant-..."     # Your Anthropic API key
  model: "claude-opus-4-8"  # alto volumen / menor costo: "claude-haiku-4-5"

# Google Calendar as a participant source (read-only).
# Granola only sees the calendars of the account it was signed up with, so most
# meetings arrive with no attendees. Reading Calendar directly recovers them.
# Authorize once with: granola-sync --mode=auth-calendar
calendar:
  enabled: false
  calendar_id: "primary"
  # Google OAuth client JSON (Desktop app). Can be shared with another tool of
  # yours: this only ever requests the calendar.readonly scope.
  client_secrets_path: ""
  token_path: "secrets/google_token.json"  # relative to this config file
  match_window_minutes: 30   # how far the event's start may sit from the recording
  title_threshold: 55        # minimum fuzzy score between title and event summary

# Logging
logging:
  dir: "logs"
  verbose: false
